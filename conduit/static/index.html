<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conduit</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e3e2dd; --accent:#2f5bd3; --ok:#1f7a4d; --warn:#a15c00; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --panel:#1f1f1d; --text:#ecebe6; --muted:#a3a29c; --line:#34332f; --accent:#7b9cff; --ok:#5fc48f; --warn:#e0a548; --bad:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:18px; margin:0; }
  header small { color:var(--muted); }
  main { display:grid; grid-template-columns: minmax(0,2fr) minmax(0,1fr); gap:16px; padding:16px 20px; max-width:1200px; margin:0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding:16px; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; min-width:0; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 10px; }
  select, input, textarea, button { font:inherit; color:inherit; }
  select, textarea { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  textarea { width:100%; min-height:72px; resize:vertical; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px; }
  .answer { white-space:pre-wrap; margin-top:14px; }
  .cite { font-size:13px; color:var(--muted); border-left:3px solid var(--line); padding-left:10px; margin-top:6px; }
  .step { font-size:13px; font-family:ui-monospace, Menlo, monospace; background:var(--bg); border-radius:6px; padding:6px 8px; margin-top:6px; overflow-x:auto; }
  .action { border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:8px; font-size:14px; }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid currentColor; }
  .pending { color:var(--warn); } .executed { color:var(--ok); } .rejected, .failed { color:var(--bad); }
  .muted { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <div><h1>Conduit</h1><small id="health">connecting…</small></div>
  <label>Signed in as <select id="user"></select></label>
</header>
<main>
  <section>
    <h2>Ask or delegate</h2>
    <textarea id="q" placeholder="e.g. Which of my accounts renew before January and what is blocking them?"></textarea>
    <div class="row">
      <button id="ask">Ask (RAG)</button>
      <button id="agent" class="secondary">Run agent</button>
      <button id="search" class="secondary">Search only</button>
    </div>
    <div id="out" class="answer"></div>
  </section>
  <section>
    <h2>Approvals</h2>
    <div class="row"><button id="refresh" class="secondary">Refresh</button><button id="sync" class="secondary">Sync sources</button></div>
    <div id="actions"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "X-Conduit-User": $("user").value } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}

async function busy(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) { $("out").innerHTML = `<span class="failed">${esc(e.message)}</span>`; }
  finally { btn.disabled = false; }
}

function renderAnswer(a) {
  let html = `<div>${esc(a.answer)}</div>`;
  if (!a.grounded) html += `<p class="muted">Not grounded in a source you can access${a.used_llm ? "" : " (model was not called)"}.</p>`;
  for (const c of a.citations || []) html += `<div class="cite">[${esc(c.id)}] ${esc(c.title)} <span class="muted">· ${esc(c.source)}</span></div>`;
  $("out").innerHTML = html;
}

function renderRun(r) {
  let html = `<div>${esc(r.answer)}</div><p class="muted">mode: ${esc(r.mode)}</p>`;
  for (const s of r.steps) html += `<div class="step">${esc(s.tool)}(${esc(JSON.stringify(s.args))}) → ${esc(JSON.stringify(s.result).slice(0, 300))}</div>`;
  $("out").innerHTML = html;
  loadActions();
}

async function loadActions() {
  const rows = await api("/actions");
  $("actions").innerHTML = rows.length ? "" : `<p class="muted">No actions yet.</p>`;
  for (const a of rows.slice().reverse()) {
    const div = document.createElement("div");
    div.className = "action";
    div.innerHTML = `<div><b>#${a.id} ${esc(a.tool)}</b> <span class="tag ${a.status}">${a.status}</span></div>
      <div class="muted">requested by ${esc(a.requested_by)}</div>
      <div class="step">${esc(JSON.stringify(a.args))}</div>`;
    if (a.status === "pending") {
      const row = document.createElement("div"); row.className = "row";
      for (const [label, verb] of [["Approve", "approve"], ["Reject", "reject"]]) {
        const b = document.createElement("button");
        b.textContent = label; if (verb === "reject") b.className = "secondary";
        b.onclick = () => busy(b, async () => { await api(`/actions/${a.id}/${verb}`, { method: "POST" }); await loadActions(); });
        row.append(b);
      }
      div.append(row);
    }
    $("actions").append(div);
  }
}

$("ask").onclick = () => busy($("ask"), async () => renderAnswer(await api("/ask", { method: "POST", body: JSON.stringify({ question: $("q").value }) })));
$("agent").onclick = () => busy($("agent"), async () => renderRun(await api("/agent", { method: "POST", body: JSON.stringify({ message: $("q").value }) })));
$("search").onclick = () => busy($("search"), async () => {
  const hits = await api(`/search?q=${encodeURIComponent($("q").value)}`);
  $("out").innerHTML = hits.length ? hits.map((h) => `<div class="cite"><b>${h.rank}. ${esc(h.title)}</b> <span class="muted">· ${esc(h.source)} · ${h.matched_by.join(" + ")}</span><br>${esc(h.text)}</div>`).join("") : `<p class="muted">No results you can access.</p>`;
});
$("refresh").onclick = () => busy($("refresh"), loadActions);
$("sync").onclick = () => busy($("sync"), async () => { const s = await api("/sync", { method: "POST" }); $("out").innerHTML = `<div class="step">${esc(JSON.stringify(s, null, 2))}</div>`; });
$("user").onchange = () => { $("out").innerHTML = ""; loadActions().catch(() => {}); };

(async () => {
  const users = await fetch("/users").then((r) => r.json());
  $("user").innerHTML = users.map((u) => `<option value="${u.id}">${esc(u.name)} — ${esc(u.role)}</option>`).join("");
  const h = await fetch("/health").then((r) => r.json());
  $("health").textContent = `${h.chunks_indexed} chunks · BM25: ${h.bm25_backend} · model: ${h.llm}`;
  loadActions().catch(() => {});
})();
</script>
</body>
</html>
