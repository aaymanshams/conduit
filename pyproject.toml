[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit"
version = "0.1.0"
description = "Permission-aware enterprise AI hub: SaaS connectors, hybrid RAG with a C++ BM25 core, and an approval-gated agent over REST and MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
conduit = "conduit.cli:main"

[tool.setuptools.packages.find]
include = ["conduit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
conduit = ["static/*"]
